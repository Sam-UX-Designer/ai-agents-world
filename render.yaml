# Render blueprint: the API and its database, in one click.
#
# Render is used here because it is the shortest path to a running API with a
# managed Postgres beside it and no credit card. Railway or Fly work equally
# well; the only things that matter are that the host runs a long-lived Node
# process (the API holds WebSockets open) and gives you a Postgres URL.
#
# Deploy: render.com -> New -> Blueprint -> pick this repository.
# Render reads this file, creates both services, generates both secrets, and
# asks you only for the two values it cannot know: your Anthropic key and the
# web app's URL. No terminal at any point.

databases:
  - name: agents-world-db
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: agents-world-api
    runtime: node
    plan: free
    # Free instances sleep when idle. A goal that is mid-run when the instance
    # sleeps resumes on the next request, because the run is persisted rather
    # than held in memory - but a paid instance is what you want in the end.
    healthCheckPath: /health
    # Two things this command has to work around:
    #
    #   `corepack enable` on its own writes a pnpm shim into /usr/bin, which
    #   is read-only on Render, and the build dies before it starts. Pointing
    #   it at a writable directory and putting that on PATH fixes it.
    #
    #   `--prod=false` because NODE_ENV is production here, and pnpm then
    #   skips devDependencies - which is where typescript and drizzle-kit
    #   live. Without it the build cannot compile or migrate anything.
    buildCommand: >-
      mkdir -p "$HOME/.local/bin" &&
      corepack enable --install-directory "$HOME/.local/bin" &&
      export PATH="$HOME/.local/bin:$PATH" &&
      pnpm install --frozen-lockfile --prod=false &&
      pnpm --filter @agents-world/shared build &&
      pnpm --filter @agents-world/api build &&
      pnpm --filter @agents-world/api db:migrate

    # Node directly, not through pnpm: the start command runs in a fresh shell
    # that has none of the build's PATH, and there is nothing pnpm would add
    # here anyway. Node resolves apps/api/node_modules from the file's own
    # directory upward.
    startCommand: node apps/api/dist/main.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: agents-world-db
          property: connectionString

      # Claude. Render asks for this during setup; it never enters the repo.
      - key: ANTHROPIC_API_KEY
        sync: false

      # The Vercel URL of the web app. Sign-in redirects back to it, so it has
      # to be exact - https, no trailing slash.
      - key: APP_URL
        sync: false

      # Signs session cookies. Any long random string; Render generates one.
      - key: SESSION_SECRET
        generateValue: true

      # Encrypts integration tokens at rest. Render generates it; the API
      # stretches whatever it is given into a full AES key.
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
